<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f2937" />
    <title>BISAK Kerf Editor</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #bar { display: flex; gap: 1rem; align-items: center; padding: 0.5rem 1rem; background: #1f2937; color: #fff; }
      #cursor { margin-left: auto; font-variant-numeric: tabular-nums; }
      #stage { flex: 1; min-height: 0; }
      #bar span { display: flex; gap: 0.25rem; align-items: center; white-space: nowrap; }
      #bar { flex-wrap: wrap; }
      #bar button { padding: 0.25rem 0.6rem; }
      #bar button.on { background: #f97316; color: #fff; border-color: #f97316; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <strong>BISAK Kerf Editor</strong>
        <label>Laser <select id="machine"></select></label>
        <span id="tools">
          <button data-tool="select" class="on">Select</button>
          <button data-tool="rect">Rectangle</button>
          <button data-tool="circle">Circle</button>
          <button data-tool="line">Line</button>
        </span>
        <span>
          <button id="score" title="Set selection to Score">Score</button>
          <button id="cut" title="Set selection to Cut">Cut</button>
          <button id="group" title="Group (Ctrl/Cmd+G)">Group</button>
          <button id="ungroup" title="Ungroup (Ctrl/Cmd+Shift+G)">Ungroup</button>
          <button id="del">Delete</button>
          <button id="undo">Undo</button>
          <button id="redo">Redo</button>
        </span>
        <span>
          <button id="imp">Import DXF</button>
          <input id="file" type="file" accept=".dxf" hidden />
          <button id="exp-dxf">Export DXF</button>
          <button id="exp-svg">Export SVG</button>
        </span>
        <label><input id="grid" type="checkbox" checked /> 1 cm grid</label>
        <span id="cursor">X – Y –</span>
      </div>
      <div id="stage"><canvas id="canvas" resize></canvas></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
