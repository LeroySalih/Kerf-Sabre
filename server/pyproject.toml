[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerf-server"
version = "0.2.0"
description = "BISAK Kerf Server: DXF clean-up, G-code post-processing, job queue and station relay"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "ezdxf>=1.3",
  "shapely>=2.0",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
kerf-admin = "kerf_server.admin:main"
kerf-server = "kerf_server.main:run"

[tool.setuptools.packages.find]
include = ["kerf_server*"]

[tool.setuptools.package-data]
kerf_server = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx`"]
