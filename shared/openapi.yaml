openapi: 3.1.0
info:
  title: BISAK Kerf API
  version: 0.2.6
  description: |
    Contract between Kerf Editor, Kerf Server and Kerf Cutter. Versioned with the JSON schemas in this folder.
    Units mm, bed space Y-up. Pupils are identified by pupil ID only, never name. Uploaded file names are never stored.

    **Roles** (bearer token, one role each): `pupil` (own jobs only), `teacher` (everything a pupil can do, plus
    approval, presets, machines, all jobs, logs), `station` (a laser PC: queue, frame, assign, stop; and the Cutter agent).

    **Job life cycle**: `draft` -> `submitted` (waiting for teacher approval) -> `approved` (in the station queue)
    -> `assigned` (run_job sent to the Cutter) -> `running` -> `done` | `failed`. `queued` means approved and pinned to one
    station. `cancelled` is used for rejected and cancelled jobs, with `statusReason`.

    **At the station**: select a job, `frame` it (laser off) so the pupil can align the material, then `assign` it with
    `materialConfirmed: true`. The server refuses unless the station is online and idle, the job was framed on that station,
    the job fits that laser's bed, and the material has been tested on that laser (teachers may override).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/me:
    get:
      summary: Who the bearer token belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401":
          description: Missing or unknown token
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/login:
    post:
      summary: Class login. A pupil signs in with their class code, pupil ID and PIN and gets a short-lived token.
      description: |
        No authorization header. The answer to a wrong class, ID or PIN is always the same `401` so nobody can find out
        which IDs exist. After 5 wrong PINs in a row the pupil is locked out for 5 minutes (`429`); too many failures
        from one address are also slowed down (`429`). The token expires (default 10 hours) and is revoked by `/auth/logout`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classCode, pupilId, pin]
              properties:
                classCode: {type: string, description: "e.g. 9B-DT (not case sensitive)"}
                pupilId: {type: string}
                pin: {type: string}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResult"}
        "401":
          description: Class, ID or PIN not right
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: Locked out or too many attempts; try again later
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /auth/logout:
    post:
      summary: End this session (revokes the token that was used)
      responses:
        "204": {description: Signed out}
  /classes:
    get:
      summary: Teacher. My classes (the ones I created, plus shared ones) and how many pupils are in each. Another teacher's class is invisible to me.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ClassInfo"}}
    post:
      summary: Teacher. Create a class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, description: "Letters, digits, - and _ (stored upper case)"}
                label: {type: string, description: "A note for teachers, e.g. Y9 set 2. Not a pupil name"}
      responses:
        "201": {description: Created}
        "409": {description: That code exists}
  /classes/{code}/pupils:
    parameters:
      - {name: code, in: path, required: true, schema: {type: string}}
    get:
      summary: Teacher. Pupil IDs in the class (never PINs)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ClassPupil"}}
    post:
      summary: Teacher. Add pupil IDs to the class. New pupils get a random PIN, returned once and never stored in the clear.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pupilIds]
              properties:
                pupilIds: {type: array, items: {type: string}, maxItems: 500}
      responses:
        "201":
          description: "PINs for the pupils that were new. Already-listed pupils keep their PIN; an ID that belongs to another class is reported in `conflicts`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: array, items: {type: object, properties: {pupilId: {type: string}, pin: {type: string}}}}
                  existing: {type: array, items: {type: string}}
                  conflicts: {type: array, items: {type: string}}
  /classes/{code}/pupils/{pupilId}:
    delete:
      summary: Teacher. Remove a pupil from the class and end their sessions
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: pupilId, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Removed}
  /pupils/{pupilId}/reset-pin:
    post:
      summary: Teacher. New random PIN (returned once), lockout cleared, existing sessions ended
      parameters:
        - {name: pupilId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object, properties: {pupilId: {type: string}, pin: {type: string}}}
  /classes/{code}/activities:
    parameters:
      - {name: code, in: path, required: true, schema: {type: string}}
    get:
      summary: Teacher (who looks after the class). The class's activities, in order, with how many pupils are at each stage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ActivityWithCounts"}}
    post:
      summary: Teacher. Set an activity for the class (pupils see it once `published` is true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string}
                instructions: {type: string}
                presetId: {type: [string, "null"], description: A suggested material}
                dueAt: {type: [string, "null"], format: date-time}
                published: {type: boolean, default: false}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Activity"}
  /classes/{code}/activities/{activityId}:
    parameters:
      - {name: code, in: path, required: true, schema: {type: string}}
      - {name: activityId, in: path, required: true, schema: {type: string}}
    put:
      summary: Teacher. Change an activity (any of title, instructions, presetId, dueAt, published)
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Activity"}
    delete:
      summary: Teacher. Archive an activity. It disappears for everyone; pupils' work and feedback are kept.
      responses:
        "204": {description: Archived}
  /classes/{code}/activities-order:
    post:
      summary: Teacher. Put the activities in order (list every active activity id once)
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [ids], properties: {ids: {type: array, items: {type: string}}}}
      responses:
        "200": {description: The activities in their new order}
  /classes/{code}/activities-copy:
    post:
      summary: "Teacher. Copy activities into this class from another class of theirs (or duplicate within this class). Copies are hidden from pupils until published, and go to the end of the order."
      description: |
        Copies the title, instructions and suggested material. Pupils' work and feedback are never copied. Due dates are
        not copied unless `keepDueDates` is true (a new class has new dates). Within the same class, copies are titled
        "<title> (copy)". The teacher must look after both classes.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}, description: The class that receives the copies}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromClass]
              properties:
                fromClass: {type: string}
                activityIds: {type: array, items: {type: string}, description: Default is every active activity in the source class}
                keepDueDates: {type: boolean, default: false}
                published: {type: boolean, default: false, description: Make the copies visible to pupils straight away}
      responses:
        "201":
          description: The new activities
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Activity"}}
        "404": {description: A class or an activity was not found, or is not yours}
  /classes/{code}/progress:
    get:
      summary: Teacher. Every pupil against every activity
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClassProgress"}
  /classes/{code}/activities/{activityId}/work/{pupilId}:
    get:
      summary: "Teacher. One pupil's work on an activity: status, the file handed in, every file made for it, and the feedback so far"
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: activityId, in: path, required: true, schema: {type: string}}
        - {name: pupilId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PupilWork"}
  /classes/{code}/activities/{activityId}/work/{pupilId}/feedback:
    post:
      summary: Teacher. Give feedback. `revise` asks the pupil to improve and resubmit; `complete` closes the activity; `comment` changes nothing.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: activityId, in: path, required: true, schema: {type: string}}
        - {name: pupilId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string}
                outcome: {enum: [comment, revise, complete], default: comment}
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Feedback"}
  /classes/{code}/pupils/{pupilId}/jobs:
    get:
      summary: Teacher (who looks after the class). All of a pupil's files
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
        - {name: pupilId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "./job.schema.json"}}
  /activities:
    get:
      summary: Pupil. The published activities set for my class, with where I am on each
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/MyActivity"}}
  /activities/{activityId}:
    get:
      summary: Pupil. One activity with my status and the feedback I have had
      parameters:
        - {name: activityId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MyActivity"}
  /activities/{activityId}/submit:
    post:
      summary: Pupil. Hand in a file for review. Defaults to the latest file made for this activity.
      parameters:
        - {name: activityId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {jobId: {type: string}}}
      responses:
        "200":
          description: Handed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PupilWork"}
        "409":
          description: No file saved for this activity yet, or it is already complete
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /dxf/cleanup:
    post:
      summary: Run the DXF clean-up pipeline (brief section 7)
      description: |
        Units come from `$INSUNITS`. When it is missing the file is assumed to be in **centimetres** (the Onshape default)
        unless `unitsOverride` says otherwise. The geometry is returned in millimetres with its bounding box bottom-left at (0,0).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                toleranceMm: {type: number, default: 0.01}
                unitsOverride: {type: string, enum: [mm, cm, inch], description: "Used when $INSUNITS is missing. Default cm."}
      responses:
        "200":
          description: Cleaned geometry and change report
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CleanupResult"}
        "413":
          description: File too large
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: File unreadable or has no usable geometry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /presets:
    get:
      summary: List presets (latest version of each)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "./preset.schema.json"}}
    post:
      summary: Create preset (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./preset.schema.json"}
      responses:
        "201": {description: Created}
  /presets/{presetId}:
    parameters:
      - {name: presetId, in: path, required: true, schema: {type: string}}
    get:
      summary: Get preset (latest version)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "./preset.schema.json"}
    put:
      summary: Update preset (teacher only); server increments version
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./preset.schema.json"}
      responses:
        "200": {description: Updated}
  /machines:
    get:
      summary: List machine profiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "./machine-profile.schema.json"}}
  /machines/{machineId}:
    parameters:
      - {name: machineId, in: path, required: true, schema: {type: string}}
    get:
      summary: Get one machine profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "./machine-profile.schema.json"}
    put:
      summary: Replace profile (teacher only), e.g. from spike results
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./machine-profile.schema.json"}
      responses:
        "200": {description: Updated}
  /jobs:
    get:
      summary: List jobs (pupils see their own; teachers and stations see all)
      parameters:
        - {name: status, in: query, schema: {type: string}, description: "One status, or several separated by commas"}
        - {name: station, in: query, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "./job.schema.json"}}
    post:
      summary: Save or submit a job. Server validates bounds, closed Cut paths and preset, and generates G-code.
      description: |
        `status` may be `draft` (saved, not yet validated for cutting) or `submitted`. Pupils can only create jobs under
        their own pupil ID. The server records the current preset version. With approval switched off in the server settings,
        a submitted job goes straight to `approved`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./job.schema.json"}
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobReceipt"}
        "422":
          description: Validation failed (out of bounds, open Cut path, unknown preset, untested material/laser)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/from-dxf:
    post:
      summary: Save a DXF as a job. The file is cleaned (see /dxf/cleanup) and kept as a draft.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, presetId]
              properties:
                file: {type: string, format: binary}
                presetId: {type: string}
                pupilId: {type: string, description: Teachers only; pupils always save under their own ID}
                toleranceMm: {type: number, default: 0.01}
                unitsOverride: {type: string, enum: [mm, cm, inch]}
                submit: {type: boolean, default: false, description: Also submit the job for approval}
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DxfJobReceipt"}
        "413":
          description: File too large
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: File unreadable, no usable geometry, or validation failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}:
    parameters:
      - {name: jobId, in: path, required: true, schema: {type: string}}
    get:
      summary: Get job
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "./job.schema.json"}
        "404":
          description: No such job, or not yours
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    put:
      summary: Replace the geometry of a draft job (owner or teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "./job.schema.json"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobReceipt"}
        "409":
          description: Only drafts can be replaced
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/submit:
    post:
      summary: Draft to submitted (validates, generates G-code, estimates)
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobReceipt"}
        "422":
          description: Validation failed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/approve:
    post:
      summary: Teacher approval. Optionally pins the job to one station.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                station: {type: string}
      responses:
        "200": {description: Approved}
        "409":
          description: Not waiting for approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/reject:
    post:
      summary: Teacher rejection. The job becomes cancelled with the reason.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        "200": {description: Rejected}
  /jobs/{jobId}/cancel:
    post:
      summary: Cancel a job that is not running (owner or teacher). Running jobs are stopped from the station.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Cancelled}
        "409":
          description: Already running or finished
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/frame:
    post:
      summary: Station mode. Trace the job outline with the laser off so the pupil can align the material.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station]
              properties:
                station: {type: string}
      responses:
        "202":
          description: Frame command sent to the Cutter
          content:
            application/json:
              schema:
                type: object
                properties:
                  bounds: {$ref: "#/components/schemas/Bounds"}
        "409":
          description: Station offline or busy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: Job does not fit this laser's bed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/assign:
    post:
      summary: Station mode selects a job; resolves per-laser preset overrides and tells the Cutter to start.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [station, materialConfirmed]
              properties:
                station: {type: string}
                materialConfirmed: {type: boolean, description: "The pupil confirmed 'Load: <material>'. Must be true."}
                allowUntested: {type: boolean, default: false, description: Teachers only}
                skipQueue: {type: boolean, default: false, description: "Teachers only: start this job although it is not next in the queue"}
      responses:
        "200":
          description: Assigned; run_job sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobReceipt"}
        "409":
          description: Station offline, busy or not idle; job not approved; not this job's turn in the queue (`not_your_turn`); job not framed on this station
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: Out of bounds for this laser, untested material, or unknown laser settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/defer:
    post:
      summary: Let others go first. An approved job goes to the back of the queue (it gets a new place, same ticket) and any framing is cleared. Owner, teacher or station.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Moved to the back
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JobReceipt"}
        "409":
          description: Not waiting in the queue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /jobs/{jobId}/gcode:
    get:
      summary: Download generated G-code (absolute, G21 G90, no G92). Stations get the version made for them.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {name: station, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: G-code
          content:
            text/plain:
              schema: {type: string}
  /queue:
    get:
      summary: The ticket queue, in cutting order (first in, first out)
      description: |
        Every approved job gets a ticket number when it enters the queue (numbers only go up and are never reused) and
        is served in queue order. A station may only frame or start the job that is next for it: the first approved
        job, in queue order, that is not pinned to another station and not reserved (framed) on another station. Teachers can move jobs
        (`/queue/{jobId}/move`) or override with `skipQueue` when assigning. Pupils see their own jobs in full; other
        pupils' entries have no pupil ID.
      parameters:
        - {name: station, in: query, required: false, schema: {type: string}, description: "Show who is next for this station (`next: true`)"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/QueueEntry"}}
  /queue/{jobId}/move:
    post:
      summary: Teacher. Change a waiting job's place in the queue. Its ticket number does not change.
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to: {enum: [front, back, up, down]}
                position: {type: integer, minimum: 1, description: "1 = next. Use `to` or `position`, not both"}
      responses:
        "200":
          description: The queue after the move
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/QueueEntry"}}
        "409":
          description: Job is not waiting in the queue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /stations:
    get:
      summary: Every laser station with its live state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Station"}}
  /stations/{stationId}:
    parameters:
      - {name: stationId, in: path, required: true, schema: {type: string}}
    get:
      summary: One station
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Station"}
  /stations/{stationId}/control:
    post:
      summary: Stop, pause or resume the job running on a station
      parameters:
        - {name: stationId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: {enum: [stop, pause, resume]}
      responses:
        "202": {description: Sent to the Cutter}
        "409":
          description: Station offline
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /stations/{stationId}/camera:
    get:
      summary: Latest camera frame for monitoring (never stored or recorded)
      parameters:
        - {name: stationId, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "404": {description: No frame available}
  /stations/{stationId}/logs:
    get:
      summary: Recent Cutter log lines (teachers)
      parameters:
        - {name: stationId, in: path, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 200, maximum: 5000}}
        - {name: level, in: query, schema: {$ref: "#/components/schemas/LogLevel"}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: array, items: {type: object}}
  /stations/{stationId}/log-level:
    put:
      summary: Remote log-level control for a Cutter
      parameters:
        - {name: stationId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: {$ref: "#/components/schemas/LogLevel"}
      responses:
        "204": {description: Sent}
  /stations/{stationId}/diagnostics:
    post:
      summary: Request a diagnostic bundle from a Cutter
      parameters:
        - {name: stationId, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Requested}
  /stations/{stationId}/diagnostics/upload:
    post:
      summary: The Cutter uploads the diagnostic bundle (a zip) it was asked for
      parameters:
        - {name: stationId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201": {description: Stored}
  /ws/cutter:
    get:
      summary: "WebSocket upgrade, opened OUTBOUND by each Cutter with its station token. Messages are CutterMessage / ServerMessage JSON."
      responses:
        "101": {description: Switching protocols}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        details: {type: array, items: {type: object}}
    ActivityStatus:
      enum: [todo, working, submitted, revise, complete]
    Activity:
      type: object
      required: [id, classCode, title, position, published]
      properties:
        id: {type: string}
        classCode: {type: string}
        title: {type: string}
        instructions: {type: string}
        position: {type: integer}
        presetId: {type: [string, "null"]}
        dueAt: {type: [string, "null"], format: date-time}
        published: {type: boolean}
    ActivityWithCounts:
      allOf:
        - {$ref: "#/components/schemas/Activity"}
        - type: object
          properties:
            counts: {type: object, description: "Pupils at each stage: working, submitted, revise, complete", additionalProperties: {type: integer}}
    Feedback:
      type: object
      required: [id, teacherId, text, outcome, createdAt]
      properties:
        id: {type: integer}
        teacherId: {type: string, description: Teacher ID, never a name}
        text: {type: string}
        outcome: {enum: [comment, revise, complete]}
        jobId: {type: [string, "null"], description: The file it was about}
        createdAt: {type: string, format: date-time}
    PupilWork:
      type: object
      required: [activityId, pupilId, status, feedback]
      properties:
        activityId: {type: string}
        pupilId: {type: string}
        status: {$ref: "#/components/schemas/ActivityStatus"}
        jobId: {type: [string, "null"], description: The file handed in}
        submittedAt: {type: [string, "null"], format: date-time}
        feedback: {type: array, items: {$ref: "#/components/schemas/Feedback"}}
        files: {type: array, description: "Teacher view only: every file made for the activity", items: {type: object}}
    MyActivity:
      allOf:
        - {$ref: "#/components/schemas/Activity"}
        - type: object
          properties:
            status: {$ref: "#/components/schemas/ActivityStatus"}
            jobId: {type: [string, "null"]}
            submittedAt: {type: [string, "null"], format: date-time}
            feedbackCount: {type: integer, description: In the list only}
            feedback: {type: array, items: {$ref: "#/components/schemas/Feedback"}, description: In the single-activity view only}
    ClassProgress:
      type: object
      required: [activities, pupils]
      properties:
        activities:
          type: array
          items: {type: object, properties: {id: {type: string}, title: {type: string}, published: {type: boolean}, dueAt: {type: [string, "null"]}}}
        pupils:
          type: array
          items:
            type: object
            properties:
              pupilId: {type: string}
              work:
                type: object
                description: By activity id
                additionalProperties:
                  type: object
                  properties:
                    status: {$ref: "#/components/schemas/ActivityStatus"}
                    jobId: {type: [string, "null"]}
                    submittedAt: {type: [string, "null"]}
                    feedbackCount: {type: integer}
    LoginResult:
      type: object
      required: [token, role, id, classCode, expiresAt]
      properties:
        token: {type: string}
        role: {const: pupil}
        id: {type: string}
        classCode: {type: string}
        expiresAt: {type: string, format: date-time}
    ClassInfo:
      type: object
      required: [code, pupilCount]
      properties:
        code: {type: string}
        label: {type: [string, "null"]}
        teacherId: {type: [string, "null"], description: "The teacher who looks after the class; null for a shared class any teacher may manage"}
        pupilCount: {type: integer}
    ClassPupil:
      type: object
      required: [pupilId, locked]
      properties:
        pupilId: {type: string}
        lastLogin: {type: [string, "null"], format: date-time}
        locked: {type: boolean}
    Me:
      type: object
      required: [role, id]
      properties:
        role: {enum: [pupil, teacher, station]}
        id: {type: string, description: "Pupil ID, teacher ID or station id. Never a name."}
    LogLevel:
      type: string
      enum: [DEBUG, INFO, WARNING, ERROR]
    Bounds:
      type: object
      required: [minX, minY, maxX, maxY]
      properties:
        minX: {type: number}
        minY: {type: number}
        maxX: {type: number}
        maxY: {type: number}
    JobReceipt:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string}
        warnings: {type: array, items: {type: string}}
        estimate: {type: object}
        ticket: {type: [integer, "null"], description: "Ticket number, once the job is approved and in the queue"}
        position: {type: [integer, "null"], description: "Place in the queue now (1 = next), while waiting"}
    QueueEntry:
      type: object
      required: [ticket, jobId, status, position, own]
      properties:
        ticket: {type: integer}
        jobId: {type: string}
        status: {enum: [approved, assigned, running]}
        position: {type: [integer, "null"], description: "1 = next. Null for jobs already on a laser"}
        pupilId: {type: [string, "null"], description: "Hidden (null) for other pupils' jobs when the caller is a pupil"}
        own: {type: boolean}
        presetId: {type: string}
        station: {type: [string, "null"], description: "A teacher pinned the job to this station, or the laser it is cutting on"}
        framedOn: {type: [string, "null"], description: "Reserved: framed on this station and being lined up"}
        next: {type: boolean, description: "Only with ?station=: this is the job that station may start now"}
        estimatedS: {type: [number, "null"]}
        aheadS: {type: [number, "null"], description: Estimated cutting time of the jobs ahead in the queue}
        approvedAt: {type: [string, "null"], format: date-time}
    DxfJobReceipt:
      allOf:
        - {$ref: "#/components/schemas/JobReceipt"}
        - type: object
          properties:
            report: {$ref: "#/components/schemas/CleanupReport"}
            units: {$ref: "#/components/schemas/UnitsInfo"}
    UnitsInfo:
      type: object
      required: [source, mmPerUnit]
      properties:
        source: {enum: [header, override, assumed-cm]}
        mmPerUnit: {type: number}
    CleanupReport:
      type: object
      required: [duplicatesRemoved, overlapsMerged, closedShapes, openPaths]
      properties:
        duplicatesRemoved: {type: integer}
        overlapsMerged: {type: integer}
        microSegmentsRemoved: {type: integer}
        scoreCutConflicts: {type: integer}
        closedShapes: {type: integer}
        openPaths: {type: integer}
        skippedEntities: {type: object, additionalProperties: {type: integer}}
        summary: {type: string, description: "e.g. Removed 37 duplicates, merged 12 overlaps, joined into 8 closed shapes, 1 open path"}
        changes: {type: array, items: {type: object}, description: For highlighting changes in the Editor}
    CleanupResult:
      type: object
      required: [objects, report]
      properties:
        objects:
          type: array
          items: {type: object, description: "Same shape as job.schema.json objects"}
        report: {$ref: "#/components/schemas/CleanupReport"}
        units: {$ref: "#/components/schemas/UnitsInfo"}
    Station:
      type: object
      required: [id, online]
      properties:
        id: {type: string, description: Machine profile id}
        online: {type: boolean}
        state: {type: string, description: "GRBL state from the last status (Idle, Run, Hold, Alarm, ...)"}
        mpos: {type: array, items: {type: number}, minItems: 3, maxItems: 3}
        currentJobId: {type: [string, "null"]}
        cutterVersion: {type: [string, "null"]}
        s30: {type: [number, "null"], description: "$30 reported by the Cutter"}
        laserMode: {type: [boolean, "null"], description: "$32=1 reported by the Cutter"}
        progress:
          description: "Live progress of the job being cut, from the Cutter. Null when nothing is running."
          type: [object, "null"]
          properties:
            jobId: {type: string}
            line: {type: integer}
            totalLines: {type: integer}
            estimatedS: {type: number}
            actualS: {type: number}
        cameraAvailable: {type: boolean}
        lastSeen: {type: [string, "null"], format: date-time}
    CutterMessage:
      description: Cutter to Server over /ws/cutter
      oneOf:
        - {$ref: "#/components/schemas/CutterHello"}
        - {$ref: "#/components/schemas/CutterStatus"}
        - {$ref: "#/components/schemas/CutterLogBatch"}
        - {$ref: "#/components/schemas/CutterCameraFrame"}
        - {$ref: "#/components/schemas/CutterJobProgress"}
        - {$ref: "#/components/schemas/CutterAck"}
        - {$ref: "#/components/schemas/CutterJobResult"}
      discriminator: {propertyName: type}
    CutterHello:
      type: object
      required: [type, station, cutterVersion, grblSettings]
      properties:
        type: {const: hello}
        station: {type: string}
        cutterVersion: {type: string}
        grblBanner: {type: string}
        grblSettings:
          type: object
          description: "Parsed $$ values keyed by number; includes $30 and $32"
          additionalProperties: {type: string}
    CutterStatus:
      type: object
      required: [type, station, state]
      properties:
        type: {const: status}
        station: {type: string}
        state: {type: string, description: "GRBL state (Idle, Run, Hold, Alarm, ...)"}
        mpos: {type: array, items: {type: number}, minItems: 3, maxItems: 3}
    CutterLogBatch:
      type: object
      required: [type, station, lines]
      properties:
        type: {const: logs}
        station: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [timestamp, level, station, event]
            properties:
              timestamp: {type: string}
              level: {$ref: "#/components/schemas/LogLevel"}
              station: {type: string}
              job_id: {type: [string, "null"]}
              event: {type: string}
    CutterCameraFrame:
      type: object
      required: [type, station, jpegBase64]
      properties:
        type: {const: camera}
        station: {type: string}
        jpegBase64: {type: string}
    CutterJobProgress:
      type: object
      required: [type, station, jobId, line, totalLines]
      properties:
        type: {const: progress}
        station: {type: string}
        jobId: {type: string}
        line: {type: integer}
        totalLines: {type: integer}
        estimatedS: {type: number}
        actualS: {type: number}
    CutterAck:
      description: The Cutter's answer to run_job. accepted false means it refused (for example its own bounds check failed).
      type: object
      required: [type, station, jobId, accepted]
      properties:
        type: {const: ack}
        station: {type: string}
        jobId: {type: string}
        accepted: {type: boolean}
        reason: {type: string}
    CutterJobResult:
      description: How a job ended. Sent once per job.
      type: object
      required: [type, station, jobId, outcome]
      properties:
        type: {const: result}
        station: {type: string}
        jobId: {type: string}
        outcome: {enum: [done, failed, cancelled]}
        message: {type: string}
        actualS: {type: number}
    ServerMessage:
      description: Server to Cutter over /ws/cutter
      oneOf:
        - {$ref: "#/components/schemas/ServerRunJob"}
        - {$ref: "#/components/schemas/ServerControl"}
      discriminator: {propertyName: type}
    ServerRunJob:
      type: object
      required: [type, jobId, gcodeUrl, presetVersion]
      properties:
        type: {const: run_job}
        jobId: {type: string}
        gcodeUrl: {type: string, description: "Path on this server, fetched with the station token"}
        gcodeSha256: {type: string}
        totalLines: {type: integer}
        estimatedS: {type: number}
        bounds: {$ref: "#/components/schemas/Bounds"}
        presetVersion: {type: integer}
        material: {type: string, description: Shown in the Load material confirmation}
    ServerControl:
      type: object
      required: [type, command]
      properties:
        type: {const: control}
        command:
          enum: [stop, pause, resume, set_log_level, diagnostic_bundle, frame]
        level: {$ref: "#/components/schemas/LogLevel"}
        jobId: {type: string, description: "For frame: the job being aligned"}
        bounds: {$ref: "#/components/schemas/Bounds"}
