<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1f2937" />
    <title>BISAK Kerf Editor</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #bar { display: flex; gap: 1rem; align-items: center; padding: 0.5rem 1rem; background: #1f2937; color: #fff; }
      #cursor { margin-left: auto; font-variant-numeric: tabular-nums; }
      #stage { flex: 1; min-height: 0; }
      #bar span { display: flex; gap: 0.25rem; align-items: center; white-space: nowrap; }
      #bar { flex-wrap: wrap; }
      #bar .anchors { display: grid; grid-template-columns: repeat(3, 16px); gap: 0; }
      #bar .anchors input { margin: 0; width: 16px; height: 16px; }
      #bar .fields { display: grid; grid-template-columns: repeat(2, auto); gap: 0.2rem 0.6rem; justify-items: end; }
      #bar .fields .lock { grid-column: 1 / -1; justify-self: start; font-size: 0.8rem; }
      #bar input[type="number"] { width: 5.5rem; }
      #bar #sides { width: 3.4rem; }
      #notice { color: #fde68a; font-weight: 600; }
      #footer { display: flex; justify-content: space-between; gap: 1rem; padding: 0.3rem 1rem; background: #1f2937; color: #e5e7eb; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
      #bar [hidden] { display: none; }
      #bar input[type="text"] { width: 9rem; }
      #warn { color: #fecaca; font-weight: 600; }
      #bar button { padding: 0.25rem 0.6rem; }
      #bar button.on { background: #f97316; color: #fff; border-color: #f97316; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <strong>BISAK Kerf Editor</strong>
        <label>Laser <select id="machine"></select></label>
        <span id="tools">
          <button data-tool="select" class="on">Select</button>
          <button data-tool="rect">Rectangle</button>
          <button data-tool="circle">Circle</button>
          <button data-tool="line">Line</button>
          <button data-tool="polygon" title="Drag from the centre to a corner. Set the number of sides next to it.">Polygon</button>
          <label class="sides" title="Number of sides for the Polygon tool">Sides <input id="sides" type="number" min="3" max="64" step="1" value="6" /></label>
          <button data-tool="pen" title="Click corner points. Click the first point or double-click to close. Enter finishes an open line, Esc cancels.">Pen</button>
          <button data-tool="text" title="Click on the bed to add text">Text</button>
          <button data-tool="measure" title="Drag between two points to read distance, dx, dy and angle">Measure</button>
          <button data-tool="trim" title="Click a line or arc to remove the part up to the nearest intersections">Trim</button>
        </span>
        <span>
          <button id="score" title="Set selection to Score">Score</button>
          <button id="cut" title="Set selection to Cut">Cut</button>
          <button id="gimbal" title="Gimbal on the selection (G): arrows move along an axis, squares scale, the ring rotates (Shift = 15 degree steps). Pivot is the anchor you picked.">Gimbal</button>
          <button id="b-union" title="Union: merge the selected shapes into one outline">Union</button>
          <button id="b-intersect" title="Intersect: keep only the area the selected shapes share">Intersect</button>
          <button id="b-subtract" title="Subtract: remove the later-drawn shapes from the earliest-drawn one">Subtract</button>
          <button id="group" title="Group (Ctrl/Cmd+G)">Group</button>
          <button id="ungroup" title="Ungroup (Ctrl/Cmd+Shift+G)">Ungroup</button>
          <button id="copy" title="Copy (Ctrl/Cmd+C)">Copy</button>
          <button id="paste" title="Paste (Ctrl/Cmd+V)">Paste</button>
          <button id="dup" title="Duplicate (Ctrl/Cmd+D)">Duplicate</button>
          <button id="del">Delete</button>
          <button id="undo">Undo</button>
          <button id="redo">Redo</button>
        </span>
        <span id="textprops" hidden>
          <input id="t-content" type="text" placeholder="Text" size="14" title="Text content" />
          <select id="t-font" title="Font face"></select>
          <label>Size <input id="t-size" type="number" min="1" step="0.5" /> mm</label>
          <button id="t-load" title="Add a .ttf or .otf font file">Load font&hellip;</button>
          <input id="t-file" type="file" accept=".ttf,.otf" hidden />
          <button id="t-convert" title="Turn the text into plain paths (no longer editable as text)">Convert to path</button>
        </span>
        <span id="align" title="Align or space the selected shapes (a group moves as one)">
          <label>Align to <select id="align-to"><option value="selection">selection</option><option value="bed">bed</option></select></label>
          <button data-align="left" title="Align left edges">Left</button>
          <button data-align="centre" title="Centre horizontally">Centre</button>
          <button data-align="right" title="Align right edges">Right</button>
          <button data-align="top" title="Align top edges">Top</button>
          <button data-align="middle" title="Centre vertically">Middle</button>
          <button data-align="bottom" title="Align bottom edges">Bottom</button>
          <button id="dist-h" title="Equal gaps left to right (3 or more shapes)">Space H</button>
          <button id="dist-v" title="Equal gaps top to bottom (3 or more shapes)">Space V</button>
        </span>
        <span id="position" title="Position of the selection's anchor point on the bed (mm)">
          <span class="anchors"><input type="radio" name="anchor" data-col="0" data-row="0" title="Anchor: top-left" /><input type="radio" name="anchor" data-col="1" data-row="0" title="Anchor: top" /><input type="radio" name="anchor" data-col="2" data-row="0" title="Anchor: top-right" /><input type="radio" name="anchor" data-col="0" data-row="1" title="Anchor: left" /><input type="radio" name="anchor" data-col="1" data-row="1" title="Anchor: centre" /><input type="radio" name="anchor" data-col="2" data-row="1" title="Anchor: right" /><input type="radio" name="anchor" data-col="0" data-row="2" title="Anchor: bottom-left" checked /><input type="radio" name="anchor" data-col="1" data-row="2" title="Anchor: bottom" /><input type="radio" name="anchor" data-col="2" data-row="2" title="Anchor: bottom-right" /></span>
          <span class="fields">
            <label>X <input id="px" type="number" step="0.1" disabled /></label>
            <label>Y <input id="py" type="number" step="0.1" disabled /></label>
            <label>W <input id="pw" type="number" step="0.1" min="0" disabled /></label>
            <label>H <input id="ph" type="number" step="0.1" min="0" disabled /></label>
            <label>SX % <input id="psx" type="number" step="1" min="0" disabled /></label>
            <label>SY % <input id="psy" type="number" step="1" min="0" disabled /></label>
            <label title="Rotate by this many degrees (counter-clockwise +) about the anchor">Rot &deg; <input id="prot" type="number" step="1" disabled /></label>
            <label class="lock" title="Keep proportions (circles stay circles)"><input id="lock" type="checkbox" checked /> Lock ratio</label>
          </span>
        </span>
        <span>
          <button id="imp">Import DXF</button>
          <input id="file" type="file" accept=".dxf" hidden />
          <button id="exp-dxf">Export DXF</button>
          <button id="exp-svg">Export SVG</button>
        </span>
        <label><input id="grid" type="checkbox" checked /> 1 cm grid</label>
        <label title="Snap to endpoints, midpoints, centres, intersections and the grid. Hold Alt/Option to disable."><input id="snap" type="checkbox" checked /> Snap</label>
        <span id="warn" role="status"></span>
      </div>
      <div id="stage"><canvas id="canvas" resize></canvas></div>
      <div id="footer"><span id="selinfo">Nothing selected</span><span id="notice" role="status"></span><span id="cursor">X – Y –</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
