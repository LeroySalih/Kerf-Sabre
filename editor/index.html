<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f97316" />
    <title>BISAK Kerf Editor</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l12 8-5.5 1.5L9 18z"/></symbol><symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></symbol><symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></symbol><symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol><symbol id="i-polygon" viewBox="0 0 24 24"><path d="M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z"/></symbol><symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol><symbol id="i-trim" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.6"/><circle cx="6" cy="17" r="2.6"/><path d="M8.3 8.3L20 18M8.3 15.7L20 6"/></symbol><symbol id="i-text" viewBox="0 0 24 24"><path d="M5 20L12 4l7 16M8 14h8"/></symbol><symbol id="i-measure" viewBox="0 0 24 24"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></symbol><symbol id="i-gimbal" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.2 2.2M12 3l2.2 2.2M21 12l-2.2-2.2M21 12l-2.2 2.2"/></symbol></defs></svg>
    <div id="app">
      <header id="topbar">
        <span class="brand">BISAK Kerf</span>
        <div class="group" role="group" aria-label="File">
          <button id="imp" title="Import a DXF file">Import DXF</button>
          <input id="file" type="file" accept=".dxf" hidden />
          <button id="exp-dxf">Export DXF</button>
          <button id="exp-svg">Export SVG</button>
        </div>
        <div class="group" role="group" aria-label="History">
          <button id="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
          <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
        </div>
        <div class="group" role="group" aria-label="Edit">
          <button id="copy" title="Copy (Ctrl/Cmd+C)">Copy</button>
          <button id="paste" title="Paste (Ctrl/Cmd+V)">Paste</button>
          <button id="dup" title="Duplicate (Ctrl/Cmd+D)">Duplicate</button>
          <button id="del" title="Delete">Delete</button>
        </div>
        <div class="group" role="group" aria-label="View">
          <button id="gimbal" title="Gimbal on the selection (G): arrows move along an axis, squares scale, the ring rotates (Shift = 15 degree steps). The pivot is the anchor chosen in Properties."><svg class="ico"><use href="#i-gimbal"/></svg>&nbsp;Gimbal</button>
          <label><input id="grid" type="checkbox" checked /> 1 cm grid</label>
          <label title="Snap to endpoints, midpoints, centres, intersections and the grid. Hold Alt/Option to disable."><input id="snap" type="checkbox" checked /> Snap</label>
        </div>
        <div class="group menu" id="tools-menu">
          <button id="tools-btn" aria-haspopup="true" aria-expanded="false">Tools &#9662;</button>
          <div class="menu-list" id="tools-list" role="menu" hidden>
            <button role="menuitem" data-menu="test-grid">Material test grid&hellip;</button>
            <button role="menuitem" data-menu="kerf-test">Kerf test&hellip;</button>
          </div>
        </div>
        <span class="spacer"></span>
        <span id="warn" role="status"></span>
        <label>Laser <select id="machine"></select></label>
      </header>

      <nav id="palette" aria-label="Tools">
      <button data-tool="select" title="Select (box left to right encloses, right to left touches)" aria-label="select" class="on"><svg class="ico"><use href="#i-select"/></svg></button>
      <button data-tool="pen" title="Pen: click corner points. Click the first point or double-click to close, Enter finishes an open line, Esc cancels" aria-label="pen"><svg class="ico"><use href="#i-pen"/></svg></button>
      <button data-tool="rect" title="Rectangle" aria-label="rect"><svg class="ico"><use href="#i-rect"/></svg></button>
      <button data-tool="circle" title="Circle (drag from the centre)" aria-label="circle"><svg class="ico"><use href="#i-circle"/></svg></button>
      <button data-tool="polygon" title="Polygon: drag from the centre to a corner. Set the number of sides in Properties" aria-label="polygon"><svg class="ico"><use href="#i-polygon"/></svg></button>
      <button data-tool="line" title="Line" aria-label="line"><svg class="ico"><use href="#i-line"/></svg></button>
      <hr />
      <button data-tool="trim" title="Trim: click a line or arc to remove the part up to the nearest intersections" aria-label="trim"><svg class="ico"><use href="#i-trim"/></svg></button>
      <button data-tool="text" title="Text: click on the bed to add text" aria-label="text"><svg class="ico"><use href="#i-text"/></svg></button>
      <button data-tool="measure" title="Measure: drag between two points" aria-label="measure"><svg class="ico"><use href="#i-measure"/></svg></button>
      </nav>

      <main id="stage"><canvas id="canvas" resize></canvas></main>

      <aside id="side" aria-label="Properties">
        <details open>
          <summary>Properties</summary>
          <div class="body">
            <div class="pos" title="Position and size of the selection (mm). The anchor picks the point they refer to, and the pivot for scale, rotate and the gimbal.">
              <span class="anchors"><input type="radio" name="anchor" data-col="0" data-row="0" title="Anchor: top-left" /><input type="radio" name="anchor" data-col="1" data-row="0" title="Anchor: top" /><input type="radio" name="anchor" data-col="2" data-row="0" title="Anchor: top-right" /><input type="radio" name="anchor" data-col="0" data-row="1" title="Anchor: left" /><input type="radio" name="anchor" data-col="1" data-row="1" title="Anchor: centre" /><input type="radio" name="anchor" data-col="2" data-row="1" title="Anchor: right" /><input type="radio" name="anchor" data-col="0" data-row="2" title="Anchor: bottom-left" checked /><input type="radio" name="anchor" data-col="1" data-row="2" title="Anchor: bottom" /><input type="radio" name="anchor" data-col="2" data-row="2" title="Anchor: bottom-right" /></span>
              <span class="fields">
                <label>X <input id="px" type="number" step="0.1" disabled /></label>
                <label>Y <input id="py" type="number" step="0.1" disabled /></label>
                <label>W <input id="pw" type="number" step="0.1" min="0" disabled /></label>
                <label>H <input id="ph" type="number" step="0.1" min="0" disabled /></label>
                <label>SX % <input id="psx" type="number" step="1" min="0" disabled /></label>
                <label>SY % <input id="psy" type="number" step="1" min="0" disabled /></label>
                <label title="Rotate by this many degrees (counter-clockwise +) about the anchor">Rot &deg; <input id="prot" type="number" step="1" disabled /></label>
                <span></span>
                <label class="lock" title="Keep proportions (circles stay circles)"><input id="lock" type="checkbox" checked /> Lock ratio</label>
              </span>
            </div>
            <div id="opt-polygon" class="row" hidden>
              <label title="Number of sides for the Polygon tool">Polygon sides <input id="sides" type="number" min="3" max="64" step="1" value="6" style="width:4.5em" /></label>
            </div>
            <div id="textprops" hidden>
              <input id="t-content" type="text" placeholder="Text" title="Text content" />
              <select id="t-font" title="Font face"></select>
              <div class="row">
                <label>Size <input id="t-size" type="number" min="1" step="0.5" style="width:5em" /> mm</label>
                <button id="t-load" title="Add a .ttf or .otf font file">Load font&hellip;</button>
              </div>
              <input id="t-file" type="file" accept=".ttf,.otf" hidden />
              <button id="t-convert" title="Turn the text into plain paths (no longer editable as text)">Convert to path</button>
            </div>
          </div>
        </details>
        <details open>
          <summary>Arrange</summary>
          <div class="body">
            <div class="row" title="Align or space the selected shapes (a group moves as one)">
              <label>Align to <select id="align-to"><option value="selection">selection</option><option value="bed">bed</option></select></label>
            </div>
            <div class="seg">
              <button data-align="left" title="Align left edges">Left</button>
              <button data-align="centre" title="Centre horizontally">Centre</button>
              <button data-align="right" title="Align right edges">Right</button>
              <button data-align="top" title="Align top edges">Top</button>
              <button data-align="middle" title="Centre vertically">Middle</button>
              <button data-align="bottom" title="Align bottom edges">Bottom</button>
            </div>
            <div class="row">
              <button id="dist-h" title="Equal gaps left to right (3 or more shapes)">Space H</button>
              <button id="dist-v" title="Equal gaps top to bottom (3 or more shapes)">Space V</button>
            </div>
            <div class="seg">
              <button id="b-union" title="Union: merge the selected shapes into one outline">Union</button>
              <button id="b-intersect" title="Intersect: keep only the area the selected shapes share">Intersect</button>
              <button id="b-subtract" title="Subtract: remove the later-drawn shapes from the earliest-drawn one">Subtract</button>
            </div>
            <div class="row">
              <button id="group" title="Group (Ctrl/Cmd+G)">Group</button>
              <button id="ungroup" title="Ungroup (Ctrl/Cmd+Shift+G)">Ungroup</button>
            </div>
          </div>
        </details>
        <details open>
          <summary>Cuts / Layers</summary>
          <div class="body">
            <table class="layers" aria-label="Layers">
              <thead><tr><th>Layer</th><th>Speed</th><th>Power</th><th>Passes</th><th>Air</th><th>Shapes</th></tr></thead>
              <tbody id="layertable"></tbody>
            </table>
            <p class="hint" id="layerhint">Settings come from the material below and are locked.</p>
          </div>
        </details>
      </aside>

      <footer id="layerbar" aria-label="Layer and material">
        <div class="chips" role="group" aria-label="Layer">
          <button class="chip cut on" id="layer-cut" data-layer="cut" title="Cut: all the way through. Click to make new shapes Cut, and to change the selected shapes."><i class="sw cut"></i>Cut</button>
          <button class="chip score" id="layer-score" data-layer="score" title="Score: a surface line only. Click to make new shapes Score, and to change the selected shapes."><i class="sw score"></i>Score</button>
        </div>
        <div class="material">
          <label>Material <select id="material"></select></label>
          <span class="op locked" id="mat-kerf" title="Kerf: how much material the laser removes"></span>
          <span class="op locked" id="mat-cut"></span>
          <span class="op locked" id="mat-score"></span>
          <span class="flag" id="mat-flag"></span>
        </div>
      </footer>

      <footer id="footer"><span id="selinfo">Nothing selected</span><span id="notice" role="status"></span><span id="cursor">X &ndash; Y &ndash;</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
